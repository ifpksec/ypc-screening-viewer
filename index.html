<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>YPC 1차 스크리닝 뷰어</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css?v=20261117c">
</head>
<body>
<div id="gate" class="gate">
  <form id="gateForm" class="gate-box">
    <h1>YPC 1차 스크리닝</h1>
    <p class="muted">심사 중 자료입니다. 접근코드를 입력하세요.</p>
    <input id="code" type="password" autocomplete="off" placeholder="접근코드" required>
    <button class="btn primary" type="submit">열기</button>
    <p id="gateMsg" class="err" role="alert"></p>
  </form>
</div>
<div id="app" hidden>
  <div id="impbar" class="impbar" hidden></div>
  <header class="top">
    <div class="brand"><span class="logo"></span><b>YPC 1차 스크리닝</b><span id="total" class="muted"></span></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <button id="logout" class="btn ghost small">잠그기</button>
  </header>
  <main>
    <section id="view-stats" class="view" hidden></section>
    <section id="view-cards" class="view" hidden>
      <div class="toolbar">
        <input id="q" type="search" placeholder="번호·제목·요약 검색">
        <select id="sort" aria-label="정렬">
          <option value="id">번호순</option>
          <option value="chars-d">분량 많은순</option>
          <option value="chars-a">분량 적은순</option>
          <option value="age-a">연령 낮은순</option>
          <option value="age-d">연령 높은순</option>
        </select>
        <button id="reset" class="btn ghost small">필터 초기화</button>
      </div>
      <div id="filters"></div>
      <div id="active" class="active"></div>
      <div id="count" class="muted count"></div>
      <div id="grid" class="grid"></div>
      <div id="pager" class="pager"></div>
    </section>
    <section id="view-judge" class="view" hidden>
      <div id="jhead"></div>
      <div class="toolbar">
        <input id="jq" type="search" placeholder="번호·제목·요약 검색">
        <button id="jreset" class="btn ghost small">필터 초기화</button>
      </div>
      <div id="jfilters"></div>
      <div id="jactive" class="active"></div>
      <div id="jcount" class="muted count"></div>
      <div id="jgrid" class="grid"></div>
      <div id="jpager" class="pager"></div>
    </section>
    <section id="view-settings" class="view" hidden></section>
    <section id="view-detail" class="view" hidden>
      <div class="detailbar">
        <button id="back" class="btn small">← 목록으로</button>
        <span class="grow"></span>
        <span id="navpos" class="muted"></span>
        <button id="prev" class="btn small">← 이전</button>
        <button id="next" class="btn small">다음 →</button>
      </div>
      <div id="detail" class="detail"></div>
    </section>
  </main>
</div>

<section id="orig" class="orig" hidden role="dialog" aria-modal="true">
  <div class="orig-bar">
    <b id="origTitle"></b>
    <span id="origFiles" class="tags"></span>
    <span class="grow"></span>
    <button id="origPrint" class="btn small" disabled>프린트</button>
    <button id="origDl" class="btn small" disabled>다운로드</button>
    <button id="origToken" class="btn ghost small">토큰 변경</button>
    <button id="origClose" class="btn ghost small">닫기 ✕</button>
  </div>
  <div id="origBody" class="orig-body"></div>
</section>
<div id="qr" class="qrmask" hidden role="dialog" aria-modal="true">
  <div class="qrbox">
    <h3 id="qrName"></h3>
    <img id="qrImg" alt="접근코드 QR" width="240" height="240">
    <div id="qrCode" class="codefont"></div>
    <p class="hint">스캔하면 이 코드로 바로 로그인됩니다. 링크를 아는 사람은 누구나 접근할 수 있으니 해당 심사위원에게만 전달하세요.</p>
    <div class="openrow"><button id="qrCopy" class="btn">링크 복사</button><button id="qrPrint" class="btn">인쇄</button><button id="qrClose" class="btn primary">닫기</button></div>
  </div>
</div>
<script src="config.js?v=20261117c"></script>
<script src="app.js?v=20261117c"></script>
</body>
</html>
